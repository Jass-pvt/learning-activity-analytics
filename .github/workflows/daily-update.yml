
name: Daily learning activity and streak maintenance

on:
  schedule:
    # 10:00 PM IST every day (16:30 UTC)
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect real learning activity
        run: python -m tracker.run

      - name: Record daily automation heartbeat
        run: |
          mkdir -p data
          touch data/daily-log.md

          TODAY="$(TZ=Asia/Kolkata date +%F)"

          if ! grep -q "^${TODAY} " data/daily-log.md; then
            echo "${TODAY} | Automated tracker heartbeat; not a claim of learning activity." >> data/daily-log.md
          fi

      - name: Commit daily snapshot and heartbeat
        env:
          CONTRIBUTION_NAME: ${{ vars.CONTRIBUTION_NAME }}
          CONTRIBUTION_EMAIL: ${{ vars.CONTRIBUTION_EMAIL }}
        run: |
          set -e

          if [ -z "$CONTRIBUTION_NAME" ] || [ -z "$CONTRIBUTION_EMAIL" ]; then
            echo "::error::Configure CONTRIBUTION_NAME and CONTRIBUTION_EMAIL in repository Actions variables."
            exit 1
          fi

          git config user.name "$CONTRIBUTION_NAME"
          git config user.email "$CONTRIBUTION_EMAIL"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily learning tracker"
            git push
          fi
